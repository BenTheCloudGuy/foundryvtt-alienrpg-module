[package]
name = "alienpi-launcher"
version = "0.1.0"
description = "MU/TH/UR kiosk launcher for FoundryVTT on Raspberry Pi"
authors = ["BenTheCloudGuy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "alienpi_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
