# FoundryVTT + Alien RPG — one-command, zero-interaction stack.
#
# Provide your FoundryVTT credentials (used once, at start-up, to download and
# license the proprietary FoundryVTT application). Everything else — the Alien
# RPG system, the wy-terminal module, world creation, and launching the world —
# is fully automatic.
#
# Usage:
#   1. Copy .env.example to .env and fill in your credentials, OR export the
#      FOUNDRY_* variables in your shell.
#   2. docker compose -f docker/compose.yml up --build
#   3. Open http://localhost:30000
#
# A stable hostname is set because FoundryVTT binds its license to the
# container hostname; without it, license verification fails after a restart.

services:
  foundry:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: benthebuilder/foundryvtt-alienrpg:local
    hostname: foundry-alienrpg
    environment:
      # --- Required: your foundryvtt.com account (download + license) ---------
      FOUNDRY_USERNAME: ${FOUNDRY_USERNAME:?set FOUNDRY_USERNAME}
      FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD:?set FOUNDRY_PASSWORD}
      # --- Optional: pin a specific license key (else one is chosen for you) --
      FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_KEY:-}
      # --- Optional: admin (setup) password; blank = no password -------------
      FOUNDRY_ADMIN_KEY: ${FOUNDRY_ADMIN_KEY:-}
      # --- Automation (already baked into the image; shown here for clarity) --
      FOUNDRY_WORLD: alienrpg-cog
      FOUNDRY_TELEMETRY: "false"
    ports:
      - "30000:30000/tcp"
    volumes:
      - foundry-data:/data
    restart: unless-stopped

  # --- mDNS advertiser (optional) -------------------------------------------
  # Advertises this server as _foundryvtt._tcp so the AlienPi launcher lists it
  # by name. Uses host networking because mDNS multicast does not cross Docker's
  # bridge network. Linux hosts only — on Docker Desktop this is a no-op and the
  # launcher's port-scan fallback discovers the server instead.
  #
  # Enable with:  docker compose -f docker/compose.yml --profile mdns up --build
  foundry-mdns:
    build:
      context: ..
      dockerfile: docker/mdns/Dockerfile
    image: benthebuilder/foundryvtt-alienrpg-mdns:local
    profiles: ["mdns"]
    network_mode: host
    environment:
      FOUNDRY_STATUS_URL: ${FOUNDRY_STATUS_URL:-http://127.0.0.1:30000/api/status}
      FOUNDRY_ADVERTISE_PORT: ${FOUNDRY_ADVERTISE_PORT:-30000}
      FOUNDRY_WORLD_TITLE: ${ALIENRPG_WORLD_TITLE:-Alien RPG — Chariot of the Gods}
    depends_on:
      - foundry
    restart: unless-stopped

volumes:
  foundry-data:
